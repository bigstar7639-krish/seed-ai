<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEED AI 🌱 - Your Smart AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0a0e1a;color:#fff;height:100vh;display:flex;flex-direction:column}
header{background:#111827;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1f2937}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.logo span{color:#22c55e}
.status{font-size:12px;background:#22c55e22;color:#22c55e;padding:6px 12px;border-radius:20px;border:1px solid #22c55e}
.chat-container{flex:1;overflow-y:auto;padding:20px;max-width:800px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:15px}
.msg{max-width:80%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.5;animation:pop .3s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.user{align-self:flex-end;background:#2563eb;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#1e293b;border:1px solid #334155;border-bottom-left-radius:4px}
.ai b{color:#4ade80}
.thinking{font-size:13px;color:#94a3b8;font-style:italic}
.input-area{padding:15px;background:#111827;border-top:1px solid #1f2937;display:flex;gap:10px;max-width:800px;width:100%;margin:0 auto}
.input-area input{flex:1;background:#1e293b;border:1px solid #334155;color:#fff;padding:14px 18px;border-radius:25px;outline:none;font-size:15px}
.input-area input:focus{border-color:#22c55e}
.input-area button{background:#22c55e;color:#000;border:none;padding:14px 22px;border-radius:25px;font-weight:700;cursor:pointer;transition:.2s}
.input-area button:hover{background:#16a34a;transform:scale(1.05)}
.welcome{text-align:center;margin:auto;color:#94a3b8;padding:40px 20px}
.welcome h1{font-size:42px;color:#fff;margin-bottom:10px}
.welcome h1 span{color:#22c55e}
.welcome p{font-size:16px;margin:15px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.chip{background:#1e293b;border:1px solid #334155;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover{background:#22c55e;color:#000;border-color:#22c55e}
footer{text-align:center;font-size:11px;color:#475569;padding:8px}
</style>
</head>
<body>
<header>
<div class="logo">🌱 <span>SEED</span> AI</div>
<div class="status">● Online - V1.0</div>
</header>

<div class="chat-container" id="chat">
<div class="welcome" id="welcome">
<h1>🌱 <span>SEED</span> AI</h1>
<p>Your Personal Growth AI - Ask Anything!</p>
<div class="chips">
<div class="chip" onclick="askChip('What is SEED AI?')">🌱 What is SEED AI?</div>
<div class="chip" onclick="askChip('Create a website for me')">💻 Create website</div>
<div class="chip" onclick="askChip('Explain AI in simple words')">🤖 Explain AI</div>
<div class="chip" onclick="askChip('Give me a business idea')">💡 Business Idea</div>
</div>
</div>
</div>

<div class="input-area">
<input type="text" id="input" placeholder="Ask SEED AI anything..." onkeypress="if(event.key==='Enter') sendMsg()">
<button onclick="sendMsg()">🚀 Send</button>
</div>
<footer>SEED AI - Built for Future 🌱 | Ind4x Edition</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const welcome = document.getElementById('welcome');

const responses = {
  "hello": "Hey baby! 🌱 I'm SEED AI - Your smart assistant! How can I help you grow today?",
  "hi": "Hi there! 🌱 SEED AI here! What you want to create today?",
  "what is seed ai": "**🌱 SEED AI** is your personal AI assistant!\n\n• Super Fast ⚡\n• Smart Responses 🧠\n• 24/7 Online ✅\n• Built by YOU!\n\nAsk me anything baby!",
  "who are you": "I'm **SEED AI** 🌱 - Created for Ind4x! I'm your AI that helps you build, learn and grow! Like a seed grows into a tree!",
  "default": [
    "That's a great idea 🌱! Let me help you with that. SEED AI thinks you should focus on growth and consistency!",
    "Wow baby! 🔥 SEED AI got it! Here's my smart take: Always start small like a SEED, then grow big!",
    "SEED AI is thinking... 🌱\n\nYour idea has huge potential! Want me to create a full plan for it?",
    "I love your curiosity! 🚀 SEED AI says: Every big tree was once a small seed. Keep going!",
    "Brilliant question! 🌱 SEED AI's answer: Break it into small steps, execute one by one. Want detailed steps?"
  ]
};

function askChip(text) {
  input.value = text;
  sendMsg();
}

function sendMsg() {
  const text = input.value.trim();
  if (!text) return;
  
  if (welcome) welcome.style.display = 'none';
  
  addMsg(text, 'user');
  input.value = '';
  
  const thinking = document.createElement('div');
  thinking.className = 'msg ai thinking';
  thinking.id = 'thinking';
  thinking.innerText = '🌱 SEED AI is thinking...';
  chat.appendChild(thinking);
  chat.scrollTop = chat.scrollHeight;
  
  setTimeout(() => {
    document.getElementById('thinking')?.remove();
    const lower = text.toLowerCase();
    let reply = '';
    
    if (responses[lower]) reply = responses[lower];
    else if (lower.includes('seed')) reply = responses['what is seed ai'];
    else if (lower.includes('website') || lower.includes('html')) reply = `I can create website for you! 🌱\n\n**SEED AI Website Plan:**\n\n1. HTML - Structure\n2. CSS - Beauty ✨\n3. JS - Brain 🧠\n\nTell me what kind of website you want, I will give you full code!`;
    else if (lower.includes('business')) reply = `**💡 SEED AI Business Idea:**\n\n**SEED AI Agency** 🌱\n• Sell AI websites\n• Charge $100 per site\n• Use this SEED AI template\n• Grow like a seed to tree!\n\nWant full plan?`;
    else {
      const arr = responses['default'];
      reply = arr[Math.floor(Math.random() * arr.length)];
    }
    
    addMsg(reply, 'ai');
  }, 800 + Math.random() * 700);
}

function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
